name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p evals --locked -- run --agent oracle --reps 1 --assert
      - run: cargo run -p evals --locked -- run --agent null --reps 1 --assert
      - run: for s in place cancel_all swap ask_first replay_token hide_summary; do cargo run -p evals --locked -- run --agent unsafe:$s --reps 1 --assert --out evals/out-unsafe-$s || exit 1; done
      - run: python3 scripts/docmap.py --check
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - run: cargo build -p engine-server -p mcp-server --locked
      - name: official MCP client over stdio and HTTP
        run: |
          set -e
          ENGINE_BIND=127.0.0.1:50051 ENGINE_FUND=demo:50000:10 ./target/debug/engine-server &
          sleep 1
          export ENGINE_ADDR=http://127.0.0.1:50051
          uv run --with mcp python scripts/mcp_interop_check.py --stdio target/debug/mcp-server
          python3 scripts/mcp_stdio_notifications_check.py target/debug/mcp-server
          MCP_BIND=127.0.0.1:8000 ./target/debug/mcp-server --http &
          sleep 1
          uv run --with mcp python scripts/mcp_interop_check.py --http http://127.0.0.1:8000/mcp
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The fallback path for a machine without Rust must keep building: the image, then the page.
      - run: docker build -t auto-trading-agent .
      - run: |
          set -e
          docker run -d --name demo -p 8080:8080 auto-trading-agent
          for i in $(seq 1 60); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q 'id="cockpit"'
          curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:8080/ | grep -q 403
          docker logs demo | grep -q 'web demo   http://localhost:8080'
          docker rm -f demo
