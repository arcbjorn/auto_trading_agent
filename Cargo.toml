[workspace]
resolver = "2"
members = [
    "crates/clob-proto",
    "crates/engine",
    "crates/engine-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clob-proto = { path = "crates/clob-proto" }
engine = { path = "crates/engine" }
engine-server = { path = "crates/engine-server" }
mcp-server = { path = "crates/mcp-server" }
agent-service = { path = "crates/agent-service" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "io-std", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.13", features = ["json"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
