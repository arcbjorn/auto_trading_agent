syntax = "proto3";
package clob.v1;

// Central limit order book for a single pair (ETH/USDC).
//
// Units are fixed-scale integers, never floats:
//   price_ticks:   1 tick = 0.01 USDC per ETH
//   quantity_lots: 1 lot  = 0.0001 ETH
// Every accepted order, trade and cancel receives a strictly increasing `sequence` number,
// assigned by the single matching thread. Sequence order is the total order of the market.
service Engine {
  // Place a limit order. Fills that happen immediately are returned in the response.
  // `client_order_id` is an idempotency key: repeating a request with the same key and the
  // same parameters (side, price, quantity and time in force) returns the original reply and
  // never creates a second order. The key is kept while its order is retained; an order archived
  // by age or count takes its key with it, after which the same key is a new order. Retention is
  // configured per deployment (ENGINE_RETAIN_HOURS, RETAINED_CLOSED_ORDERS) and is far longer
  // than any sane retry window.
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  // The same, pipelined: a client streams requests and receives one result per request, in
  // request order, without waiting for each round trip. A rejected request is a result carrying
  // an error, not the end of the stream. This is the path for a client placing many orders.
  rpc PlaceOrders(stream PlaceOrderRequest) returns (stream PlaceOrderResult);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
  // Aggregated price levels, best price first on each side.
  rpc GetOrderBook(GetOrderBookRequest) returns (OrderBook);
  rpc GetMarket(GetMarketRequest) returns (Market);
  // Credits an account. Every order must be backed: a buy reserves price x quantity in USDC, a
  // sell reserves the quantity in ETH; fills settle both legs, cancels release the remainder.
  rpc Deposit(DepositRequest) returns (Balances);
  rpc GetBalances(GetBalancesRequest) returns (Balances);
  // Debits what is available; reserved amounts back live orders and cannot be withdrawn.
  rpc Withdraw(WithdrawRequest) returns (Balances);
  // The account's trading ledger: flows, volume, venue inventory at average cost, realised P&L.
  rpc GetStatement(GetStatementRequest) returns (Statement);
  // Every event from now on, in sequence order: accepted orders, trades, cancels, rejects,
  // deposits and withdrawals. With an account_id only that account's events are sent, with the
  // counterparty of a trade hidden. A subscriber that falls too far behind is told so and must
  // resynchronise from GetOrderBook / ListOrders.
  rpc Subscribe(SubscribeRequest) returns (stream EngineEvent);
  // Matcher counters for dashboards: commands and batches so far, the largest batch, events
  // broadcast, orders and trades retained, the sequence, and how full the command queue is.
  rpc GetStats(GetStatsRequest) returns (EngineStats);
}

message GetStatsRequest {}

message EngineStats {
  uint64 commands = 1;
  uint64 batches = 2;
  uint64 max_batch = 3;
  uint64 events = 4;
  uint64 orders_retained = 5;
  uint64 trades_retained = 6;
  uint64 sequence = 7;
  uint32 queue_free = 8;
  uint32 queue_capacity = 9;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum TimeInForce {
  TIF_UNSPECIFIED = 0; // treated as GTC
  GTC = 1;             // rest the remainder in the book
  IOC = 2;             // fill what crosses now, cancel the remainder
  FOK = 3;             // fill the whole quantity now or reject without touching the book
}

enum OrderStatus {
  STATUS_UNSPECIFIED = 0; // in ListOrdersRequest: no filter
  OPEN = 1;
  PARTIALLY_FILLED = 2;
  FILLED = 3;
  CANCELLED = 4;
  REJECTED = 5;
}

message PlaceOrderRequest {
  string account_id = 1;
  string client_order_id = 2;
  Side side = 3;
  int64 price_ticks = 4;
  int64 quantity_lots = 5;
  TimeInForce tif = 6;
}

// The best prices right after a command was applied, so a caller that only needs to report
// the market after its own action need not read again. 0 = that side is empty.
message TopOfBook {
  int64 best_bid_ticks = 1;
  int64 best_ask_ticks = 2;
  uint64 sequence = 3;
}

message PlaceOrderResponse {
  Order order = 1;
  repeated Trade fills = 2;
  TopOfBook top = 3;
}

message PlaceOrderResult {
  PlaceOrderResponse placed = 1; // set when the request succeeded
  string error_code = 2;         // gRPC status code name when it did not, e.g. INVALID_ARGUMENT
  string error_message = 3;
}

message CancelOrderRequest {
  string account_id = 1;
  string order_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
  TopOfBook top = 2;
}

message GetOrderRequest {
  string account_id = 1;
  string order_id = 2;
}

message ListOrdersRequest {
  string account_id = 1;
  OrderStatus status = 2; // STATUS_UNSPECIFIED = all
  uint32 limit = 3;       // 0 = default (10), capped server-side
}

message ListOrdersResponse {
  repeated Order orders = 1; // newest first
}

message ListTradesRequest {
  string account_id = 1; // empty = all accounts; set = only trades this account took part in, counterparty hidden
  uint32 limit = 2;      // 0 = default (10), capped server-side
}

message ListTradesResponse {
  repeated Trade trades = 1; // newest first
}

message GetOrderBookRequest {
  uint32 depth = 1; // levels per side, 0 = default (5), capped server-side
}

message GetMarketRequest {}

message DepositRequest {
  string account_id = 1;
  uint64 usdc_micro = 2; // 1 unit = 0.000001 USDC (one tick times one lot)
  uint64 eth_lots = 3;   // 1 lot = 0.0001 ETH
}

message GetBalancesRequest {
  string account_id = 1;
}

message WithdrawRequest {
  string account_id = 1;
  uint64 usdc_micro = 2;
  uint64 eth_lots = 3;
}

message GetStatementRequest {
  string account_id = 1;
}

message Statement {
  string account_id = 1;
  uint64 deposits_usdc_micro = 2;
  uint64 deposits_eth_lots = 3;
  uint64 withdrawals_usdc_micro = 4;
  uint64 withdrawals_eth_lots = 5;
  uint64 bought_lots = 6;
  uint64 sold_lots = 7;
  uint64 usdc_paid_micro = 8;
  uint64 usdc_received_micro = 9;
  uint64 inventory_lots = 10;         // bought here and not yet sold
  uint64 inventory_cost_micro = 11;   // what that inventory cost; average cost is the ratio
  uint64 sold_from_deposits_lots = 12; // sold beyond the venue inventory, no cost basis, no P&L
  int64 realised_pnl_micro = 13;
  uint64 trades = 14;
}

message Balances {
  string account_id = 1;
  uint64 usdc_available_micro = 2;
  uint64 usdc_reserved_micro = 3; // backing the account's live buy orders
  uint64 eth_available_lots = 4;
  uint64 eth_reserved_lots = 5;   // backing the account's live sell orders
  bool enforced = 6;              // false when the engine runs without balance checks
}

message Order {
  string order_id = 1;
  string account_id = 2;
  string client_order_id = 3;
  Side side = 4;
  int64 price_ticks = 5;
  int64 quantity_lots = 6;
  int64 remaining_lots = 7;
  OrderStatus status = 8;
  uint64 sequence = 9;
  int64 created_at_unix_ns = 10; // wall clock, for reporting only; never used for ordering
  // Empty unless CANCELLED: "user", "ioc", "fok", "self_trade_prevention" or "exposure_limit".
  string cancel_reason = 11;
}

message Trade {
  string trade_id = 1;
  string maker_order_id = 2;
  string taker_order_id = 3;
  int64 price_ticks = 4; // always the maker's price
  int64 quantity_lots = 5;
  uint64 sequence = 6;
  int64 executed_at_unix_ns = 7;
  Side taker_side = 8;      // the aggressor's side; the maker took the other side
  // In an account-scoped ListTrades only the requesting account's id is filled in; the
  // counterparty is blank. Unscoped listings carry both.
  string maker_account = 9;
  string taker_account = 10;
}

message PriceLevel {
  int64 price_ticks = 1;
  int64 quantity_lots = 2; // open quantity at this price
  uint32 order_count = 3;  // live orders at this price
}

message OrderBook {
  string symbol = 1;
  repeated PriceLevel bids = 2; // highest price first
  repeated PriceLevel asks = 3; // lowest price first
  uint64 sequence = 4;          // sequence number of the last event reflected
}

message SubscribeRequest {
  string account_id = 1; // empty = every event
}

message OrderCancelled {
  string order_id = 1;
  string account_id = 2;
  string reason = 3; // user, ioc, fok, self_trade_prevention, exposure_limit
}

message OrderRejected {
  string order_id = 1;
  string account_id = 2;
  string reason = 3;
}

message Transfer {
  string account_id = 1;
  uint64 usdc_micro = 2;
  uint64 eth_lots = 3;
}

message EngineEvent {
  uint64 sequence = 1;
  oneof event {
    Order accepted = 2;
    Trade traded = 3;
    OrderCancelled cancelled = 4;
    OrderRejected rejected = 5;
    Transfer deposited = 6;
    Transfer withdrawn = 7;
  }
}

message Market {
  string symbol = 1;
  int64 tick_size_ticks = 2;       // always 1 (0.01 USDC)
  int64 lot_size_lots = 3;         // always 1 (0.0001 ETH)
  int64 best_bid_ticks = 4;        // 0 when empty
  int64 best_ask_ticks = 5;        // 0 when empty
  int64 last_trade_price_ticks = 6; // 0 when no trade yet
  uint64 sequence = 7;
}
